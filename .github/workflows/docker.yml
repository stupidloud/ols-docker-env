name: docker-build

on:
  push:
    branches:
      - mysql

  pull_request:
    branches:
      - mysql

  workflow_dispatch :

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup
        run: |
          docker compose version
          docker compose up -d
          docker image ls
          sleep 10
      - name: Verify
        run: bash .travis/verify.sh    
      - name: Clean up 
        run: |
         docker compose stop
         docker compose rm -f            
